<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mireille</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    html, body {
      background: var(--win-face);
      height: 100%;
      overflow: hidden;
    }

    /* Fixed full-screen Notepad — stays put while titles scroll */
    .notepad {
      position: fixed;
      z-index: 0;
      inset: clamp(0.55rem, 2.2vw, 0.9rem);
      display: flex;
      flex-direction: column;
      background: var(--win-face);
      border-top: 2px solid var(--win-light);
      border-left: 2px solid var(--win-light);
      border-right: 2px solid var(--win-darker);
      border-bottom: 2px solid var(--win-darker);
      box-shadow: 3px 3px 0 rgba(9, 10, 12, 0.28);
      user-select: none;
      pointer-events: none;
    }

    .np-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      margin: 2px;
      padding: 2px 3px 2px 5px;
      background: var(--win-title);
      color: #fff;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      flex-shrink: 0;
    }

    .np-title span {
      white-space: nowrap;
    }

    .np-btns {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .np-btn {
      width: 16px;
      height: 14px;
      display: grid;
      place-items: center;
      background: var(--win-face);
      color: #000;
      border-top: 1px solid var(--win-light);
      border-left: 1px solid var(--win-light);
      border-right: 1px solid var(--win-darker);
      border-bottom: 1px solid var(--win-darker);
      font-size: 9px;
      line-height: 1;
      font-family: var(--sans);
      font-weight: 700;
    }

    .np-menu {
      display: flex;
      gap: 0.85rem;
      padding: 2px 8px 3px;
      font-family: var(--sans);
      font-size: 11px;
      color: #000;
      background: var(--win-face);
      flex-shrink: 0;
    }

    .np-menu span::first-letter {
      text-decoration: underline;
    }

    .np-body {
      flex: 1;
      display: flex;
      min-height: 0;
      margin: 0 2px 2px;
      border-top: 1px solid var(--win-dark);
      border-left: 1px solid var(--win-dark);
      border-right: 1px solid var(--win-light);
      border-bottom: 1px solid var(--win-light);
      background: #000;
    }

    .np-view {
      flex: 1;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(9, 10, 12, 0.12) 0%, rgba(9, 10, 12, 0.28) 70%, rgba(9, 10, 12, 0.4) 100%),
        #090a0c url("mireille.jpg") center / cover no-repeat;
    }

    .np-scroll {
      width: 16px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--win-face);
      border-left: 1px solid var(--win-dark);
    }

    .np-arrow {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: var(--win-face);
      border-top: 1px solid var(--win-light);
      border-left: 1px solid var(--win-light);
      border-right: 1px solid var(--win-darker);
      border-bottom: 1px solid var(--win-darker);
      font-size: 8px;
      line-height: 1;
      color: #000;
    }

    .np-track {
      flex: 1;
      position: relative;
      background:
        repeating-linear-gradient(
          -45deg,
          #fff 0,
          #fff 1px,
          var(--win-face) 1px,
          var(--win-face) 3px
        );
    }

    .np-thumb {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 22%;
      background: var(--win-face);
      border-top: 1px solid var(--win-light);
      border-left: 1px solid var(--win-light);
      border-right: 1px solid var(--win-darker);
      border-bottom: 1px solid var(--win-darker);
    }

    .home-scroll {
      position: relative;
      z-index: 1;
      height: 100vh;
      height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .shot {
      position: relative;
      min-height: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 2.5rem);
      text-align: center;
    }

    .shot-brand {
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      font-size: clamp(0.7rem, 1.9vw, 0.78rem);
      font-weight: 500;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: rgba(247, 245, 241, 0.92);
      text-shadow:
        0 0 12px rgba(247, 245, 241, 0.28),
        0 0 28px rgba(247, 245, 241, 0.12);
    }

    .shot-hint {
      margin-top: 1.15rem;
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      font-size: 0.68rem;
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(247, 245, 241, 0.42);
      text-shadow: 0 0 16px rgba(247, 245, 241, 0.1);
    }

    .shot a {
      display: block;
      max-width: min(88vw, 18rem);
      color: #f7f5f1;
      text-decoration: none;
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      font-size: clamp(1.2rem, 4.2vw, 1.55rem);
      font-weight: 500;
      font-style: italic;
      line-height: 1.3;
      letter-spacing: 0.04em;
      text-shadow:
        0 0 14px rgba(247, 245, 241, 0.35),
        0 0 32px rgba(247, 245, 241, 0.16),
        0 0 48px rgba(247, 245, 241, 0.08);
      transition: opacity 0.3s ease, letter-spacing 0.35s ease, transform 0.35s ease, text-shadow 0.35s ease;
    }

    .shot a:hover,
    .shot a:focus-visible {
      opacity: 0.9;
      letter-spacing: 0.07em;
      transform: translateY(-1px);
      text-shadow:
        0 0 18px rgba(247, 245, 241, 0.48),
        0 0 40px rgba(247, 245, 241, 0.22),
        0 0 64px rgba(247, 245, 241, 0.12);
      outline: none;
    }
  </style>
</head>
<body>
  <div class="notepad" aria-hidden="true">
    <div class="np-title">
      <span>--- Notepad</span>
      <div class="np-btns">
        <span class="np-btn">_</span>
        <span class="np-btn">□</span>
        <span class="np-btn">×</span>
      </div>
    </div>
    <div class="np-menu">
      <span>File</span>
      <span>Edit</span>
      <span>Search</span>
      <span>Help</span>
    </div>
    <div class="np-body">
      <div class="np-view"></div>
      <div class="np-scroll">
        <span class="np-arrow">▲</span>
        <div class="np-track">
          <span class="np-thumb"></span>
        </div>
        <span class="np-arrow">▼</span>
      </div>
    </div>
  </div>

  <main class="home-scroll" aria-label="Mireille">
    <section class="shot" data-reveal>
      <p class="shot-brand">Mireille</p>
      <p class="shot-hint">Scroll</p>
    </section>

    <section class="shot" data-reveal>
      <a href="who.html">Who Are You?</a>
    </section>

    <section class="shot" data-reveal>
      <a href="making.html">The Making of Mireille.</a>
    </section>

    <section class="shot" data-reveal>
      <a href="life.html">The Life He Left Behind.</a>
    </section>

    <section class="shot" data-reveal>
      <a href="backstage.html">How Do I Get Backstage?</a>
    </section>

    <section class="shot" data-reveal>
      <a href="terms.html">Terms of Use.</a>
    </section>
  </main>

  <script src="shared.js"></script>
</body>
</html>
