    .stage {

    .head { width: 100%; max-width: 34rem; text-align: center; }
    .head h1 {

    .panel {
      width: min(100%, 22rem);

    .links {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      margin-bottom: 0.35rem;
    }

    .links a {
      display: block;
      padding: 0.7rem 0.4rem;
      font-size: clamp(1.18rem, 3.5vw, 1.4rem);
      color: var(--ink-dark);
      text-decoration: none;
      text-align: center;
      border: 0;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: background 0.2s ease, letter-spacing 0.25s ease;
    }

    .links a:hover,
    .links a:focus-visible {
      background: rgba(184, 184, 183, 0.45);
      letter-spacing: 0.03em;
      outline: none;
    }

    .footer-back { margin-top: clamp(1.75rem, 4vh, 2.5rem); }
  </style>
</head>
