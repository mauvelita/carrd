<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mireille</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400;1,6..96,500&display=swap" />
  <style>
    html, body {
      background: #090a0c;
    }

    .photo-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(9, 10, 12, 0.22) 0%, rgba(9, 10, 12, 0.42) 70%, rgba(9, 10, 12, 0.58) 100%),
        #090a0c url("mireille.jpg") center / cover no-repeat;
      transform: scale(1.02);
    }

    .home-scroll {
      position: relative;
      z-index: 1;
    }

.shot a {
  display: block;
  max-width: min(88vw, 18rem);
  color: #f7f5f1;
  text-decoration: none;
  font-family: "Bodoni Moda", "Times New Roman", serif;
  font-size: clamp(1.2rem, 4.2vw, 1.55rem);
  font-weight: 400;
  font-style: normal;
  font-optical-sizing: auto;
  line-height: 1.25;
  letter-spacing: 0.06em;
  text-shadow: none;
  transition: opacity 0.3s ease, letter-spacing 0.35s ease, transform 0.35s ease;
}

.shot a:hover,
.shot a:focus-visible {
  opacity: 0.78;
  letter-spacing: 0.09em;
  transform: translateY(-1px);
  outline: none;
}
  </style>
</head>
<body>
  <div class="photo-bg" aria-hidden="true"></div>

  <main class="home-scroll" aria-label="Mireille">
    <section class="shot" data-reveal>
      <p class="shot-brand">Mireille</p>
      <p class="shot-hint">Scroll</p>
    </section>

    <section class="shot" data-reveal>
      <a href="who.html">Who Are You?</a>
    </section>

    <section class="shot" data-reveal>
      <a href="making.html">The Making of Mireille.</a>
    </section>

    <section class="shot" data-reveal>
      <a href="life.html">The Life He Left Behind.</a>
    </section>

    <section class="shot" data-reveal>
      <a href="backstage.html">How Do I Get Backstage?</a>
    </section>

    <section class="shot" data-reveal>
      <a href="terms.html">Terms of Use.</a>
    </section>
  </main>

  <script src="shared.js"></script>
</body>
</html>
