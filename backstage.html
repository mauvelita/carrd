<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>How Do I Get Backstage?</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .head {
      width: 100%;
      max-width: 34rem;
      text-align: center;
    }

    .head h1 {
      font-size: clamp(2.2rem, 6.8vw, 3.3rem);
      font-weight: 500;
      margin-top: 0.35rem;
    }

    .stage {
      width: 100%;
      max-width: 22rem;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(1.1rem, 3vw, 1.45rem);
    }

    .panel {
      width: 100%;
      background: rgba(190, 202, 203, 0.55);
      border-top: 1px solid rgba(255, 255, 255, 0.4);
      border-left: 1px solid rgba(255, 255, 255, 0.28);
      border-right: 1px solid rgba(96, 100, 103, 0.45);
      border-bottom: 1px solid rgba(53, 53, 51, 0.45);
      box-shadow: 2px 2px 0 rgba(9, 10, 12, 0.12);
      padding: 0.75rem 0.55rem 0.3rem;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .panel .label {
      margin: 0 0 0.5rem;
      padding: 0 0.25rem 0.5rem;
      color: var(--slate);
      text-shadow: none;
      border-bottom: 1px solid rgba(96, 100, 103, 0.28);
      text-align: center;
    }

    .links {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .links a {
      position: relative;
      display: block;
      padding: 0.65rem 1.4rem;
      font-family: var(--serif);
      font-size: clamp(1.15rem, 3.4vw, 1.35rem);
      font-style: italic;
      font-weight: 500;
      color: var(--ink-dark);
      text-decoration: none;
      text-align: center;
      letter-spacing: 0.02em;
      transition: background 0.12s ease, color 0.12s ease, letter-spacing 0.18s ease;
    }

    .links a::before {
      content: "►";
      position: absolute;
      left: 0.4rem;
      top: 50%;
      transform: translateY(-50%);
      font-style: normal;
      font-size: 0.55em;
      opacity: 0;
      color: #fff;
      transition: opacity 0.12s ease;
    }

    .links a:hover,
    .links a:focus-visible {
      background: #000080;
      color: #fff;
      letter-spacing: 0.05em;
      outline: none;
    }

    .links a:hover::before,
    .links a:focus-visible::before {
      opacity: 1;
    }

    .footer-back {
      margin-top: clamp(2.25rem, 5vh, 3.25rem);
    }
  </style>
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>
  <main class="shell">
    <header class="head" data-reveal>
      <p class="label">Access</p>
      <h1 class="display">How Do I Get Backstage?</h1>
      <hr class="hairline" />
    </header>

    <div class="stage">
      <section class="panel" data-reveal>
        <p class="label">Main contacts</p>
        <div class="links">
          <a href="https://www.instagram.com/mauvelita" target="_blank" rel="noopener noreferrer">Instagram</a>
          <a href="https://x.com/asphyxielle" target="_blank" rel="noopener noreferrer">Twitter</a>
        </div>
      </section>

      <section class="panel" data-reveal>
        <p class="label">Ask me anything</p>
        <div class="links">
          <a href="https://tellonym.me/principesssa" target="_blank" rel="noopener noreferrer">Tellonym</a>
        </div>
      </section>
    </div>

    <div class="footer-back">
      <nav class="footer-nav" aria-label="Page navigation">
        <a href="home.html" data-nav-home>Back</a>
      </nav>
    </div>
  </main>
  <script src="shared.js"></script>
</body>
</html>
