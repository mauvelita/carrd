<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mireille</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .home {
      position: relative;
      z-index: 1;
      width: min(94vw, 400px);
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      padding: clamp(1.25rem, 4vw, 2rem);
      padding-bottom: var(--bottom-safe);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.35rem, 3.8vh, 2rem);
      text-align: center;
    }

    .brand {
      font-size: clamp(0.68rem, 2vw, 0.76rem);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--ink-dark);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .win {
      width: 100%;
      background: var(--win-face);
      border-top: 2px solid var(--win-light);
      border-left: 2px solid var(--win-light);
      border-right: 2px solid var(--win-darker);
      border-bottom: 2px solid var(--win-darker);
      box-shadow: 3px 3px 0 rgba(9, 10, 12, 0.35);
      user-select: none;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .win:hover {
      transform: translateY(-2px);
      box-shadow: 4px 6px 0 rgba(9, 10, 12, 0.32);
    }

    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin: 2px;
      padding: 3px 4px;
      background: var(--win-title);
      color: #fff;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 700;
    }

    .title-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .win-controls { display: flex; gap: 2px; }
    .win-btn {
      width: 16px; height: 14px; padding: 0;
      border-top: 1px solid var(--win-light);
      border-left: 1px solid var(--win-light);
      border-right: 1px solid var(--win-darker);
      border-bottom: 1px solid var(--win-darker);
      background: var(--win-face);
      color: #000;
      font-size: 9px;
      line-height: 1;
      display: grid;
      place-items: center;
      font-family: var(--sans);
      font-weight: 700;
    }

    .menubar {
      display: flex;
      gap: 0.75rem;
      padding: 2px 8px 4px;
      font-family: var(--sans);
      font-size: 11px;
      color: #000;
      text-align: left;
      background: var(--win-face);
    }

    .viewport {
      margin: 0 2px 2px;
      border-top: 2px solid var(--win-dark);
      border-left: 2px solid var(--win-dark);
      border-right: 2px solid var(--win-light);
      border-bottom: 2px solid var(--win-light);
      background: var(--void);
      aspect-ratio: 4 / 5;
      overflow: hidden;
      position: relative;
    }

    .viewport img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 28%;
      filter: saturate(0.75) contrast(1.05);
      transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .win:hover .viewport img { transform: scale(1.03); }

    .scroll {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 16px;
      background: var(--win-face);
      border-left: 1px solid var(--win-dark);
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    .scroll .track {
      flex: 1;
      margin: 1px;
      background:
        repeating-linear-gradient(
          135deg,
          #fff 0 1px,
          transparent 1px 3px
        ),
        var(--win-face);
      border-top: 1px solid var(--win-dark);
      border-left: 1px solid var(--win-dark);
      border-right: 1px solid var(--win-light);
      border-bottom: 1px solid var(--win-light);
    }

    .nav {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
      padding: 0.35rem 0.5rem 0.15rem;
      background: rgba(190, 202, 203, 0.42);
      border-top: 1px solid rgba(255, 255, 255, 0.35);
      border-left: 1px solid rgba(255, 255, 255, 0.25);
      border-right: 1px solid rgba(96, 100, 103, 0.4);
      border-bottom: 1px solid rgba(53, 53, 51, 0.4);
    }

    .nav a {
      display: block;
      width: 100%;
      max-width: 22rem;
      padding: 0.4rem 0.35rem;
      color: var(--ink-dark);
      text-decoration: none;
      font-size: clamp(1.15rem, 4.2vw, 1.38rem);
      line-height: 1.25;
      text-align: center;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: letter-spacing 0.25s ease, color 0.25s ease, background 0.25s ease;
    }

    .nav a:hover,
    .nav a:focus-visible {
      color: var(--void);
      letter-spacing: 0.02em;
      background: rgba(184, 184, 183, 0.35);
      outline: none;
    }

  </style>
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>
  <main class="home" aria-label="Mireille home">
    <p class="brand" data-reveal>Mireille</p>

    <section class="win" data-reveal aria-label="Portrait window">
      <div class="titlebar">
        <span class="title-text">--- Notepad</span>
        <div class="win-controls" aria-hidden="true">
          <span class="win-btn">_</span>
          <span class="win-btn">□</span>
          <span class="win-btn">×</span>
        </div>
      </div>
      <div class="menubar" aria-hidden="true">
        <span>File</span><span>Edit</span><span>Search</span><span>Help</span>
      </div>
      <div class="viewport">
<img src="main.jpg" alt="Portrait of Mireille" width="1200" height="1500" draggable="false" />
        <div class="scroll" aria-hidden="true"><div class="track"></div></div>
      </div>
    </section>

    <nav class="nav" aria-label="Sections">
      <a href="who.html" data-reveal>Who Are You?</a>
      <a href="making.html" data-reveal>The Making of Mireille.</a>
      <a href="life.html" data-reveal>The Life He Left Behind.</a>
      <a href="backstage.html" data-reveal>How Do I Get Backstage?</a>
      <a href="terms.html" data-reveal>Terms of Use.</a>
    </nav>
  </main>
  <script src="shared.js"></script>
</body>
</html>
