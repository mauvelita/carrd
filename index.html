<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mireille — Twist of Fate</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .splash {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: #000;
    }

    .splash.is-gone {
      display: none;
    }

    .sys {
      width: min(92vw, 22rem);
      background: var(--win-face);
      border-top: 2px solid var(--win-light);
      border-left: 2px solid var(--win-light);
      border-right: 2px solid var(--win-darker);
      border-bottom: 2px solid var(--win-darker);
      box-shadow: 4px 4px 0 rgba(9, 10, 12, 0.45);
      user-select: none;
    }

    .sys-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin: 2px;
      padding: 3px 4px;
      background: var(--win-title);
      color: #fff;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 700;
    }

    .sys-x {
      width: 16px;
      height: 14px;
      display: grid;
      place-items: center;
      background: var(--win-face);
      color: #000;
      border-top: 1px solid var(--win-light);
      border-left: 1px solid var(--win-light);
      border-right: 1px solid var(--win-darker);
      border-bottom: 1px solid var(--win-darker);
      font-size: 9px;
      line-height: 1;
      font-family: var(--sans);
      font-weight: 700;
    }

    .sys-body {
      padding: 1.35rem 1.1rem 1.1rem;
      text-align: center;
      color: #000;
      font-family: var(--sans);
    }

    .sys-msg {
      margin: 0 0 1.15rem;
      font-size: clamp(0.95rem, 3.6vw, 1.05rem);
      font-weight: 700;
      line-height: 1.35;
    }

    .sys-enter {
      appearance: none;
      min-width: 5.5rem;
      padding: 0.35rem 1.1rem 0.4rem;
      font-family: var(--sans);
      font-size: 0.95rem;
      font-weight: 700;
      color: #000;
      background: var(--win-face);
      border-top: 2px solid var(--win-light);
      border-left: 2px solid var(--win-light);
      border-right: 2px solid var(--win-darker);
      border-bottom: 2px solid var(--win-darker);
      cursor: pointer;
    }

    .sys-enter:active {
      border-top: 2px solid var(--win-darker);
      border-left: 2px solid var(--win-darker);
      border-right: 2px solid var(--win-light);
      border-bottom: 2px solid var(--win-light);
      transform: translate(1px, 1px);
    }

    .sys-enter:focus-visible {
      outline: 1px dotted #000;
      outline-offset: 2px;
    }

    .app {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: #090a0c;
    }

    .app.is-on {
      display: block;
    }
  </style>
</head>
<body>
  <audio id="bgm" src="track.mp3" loop preload="auto"></audio>

  <div class="splash" id="splash">
    <section class="sys" role="dialog" aria-labelledby="sys-msg">
      <div class="sys-title">
        <span>System message</span>
        <span class="sys-x" aria-hidden="true">×</span>
      </div>
      <div class="sys-body">
        <p class="sys-msg" id="sys-msg">Fashion as Body Modification</p>
        <button type="button" class="sys-enter" id="enter-btn">Enter</button>
      </div>
    </section>
  </div>

  <iframe class="app" id="app" title="Mireille" src="about:blank"></iframe>

  <script>
    (() => {
      const btn = document.getElementById("enter-btn");
      const splash = document.getElementById("splash");
      const app = document.getElementById("app");
      const bgm = document.getElementById("bgm");
      if (!btn || !splash || !app || !bgm) return;

      window.__mireilleBgm = bgm;

      const setNowPlaying = () => {
        document.title = "Mireille — Twist of Fate";
        if (!("mediaSession" in navigator)) return;
        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: "Twist of Fate",
            artist: "Mireille — Now Playing",
            album: "Olivia Newton-John",
          });
          navigator.mediaSession.playbackState = "playing";
        } catch (_) {}
      };

      const enter = () => {
        try {
          sessionStorage.setItem("mireille-bgm", "1");
        } catch (_) {}

        bgm.play().then(setNowPlaying).catch(() => {});
        setNowPlaying();

        splash.classList.add("is-gone");
        app.classList.add("is-on");
        app.src = "home.html";
      };

      btn.addEventListener("click", enter);

      window.addEventListener("message", (e) => {
        if (!e || !e.data || e.data.type !== "mireille-bgm-ping") return;
        bgm.play().then(setNowPlaying).catch(() => {});
      });
    })();
  </script>
</body>
</html>
