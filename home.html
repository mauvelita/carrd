<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mireille</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    html, body {
      background: #090a0c;
    }

    .photo-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(180deg, rgba(9, 10, 12, 0.28) 0%, rgba(9, 10, 12, 0.18) 40%, rgba(9, 10, 12, 0.45) 100%),
        #090a0c url("mireille.jpg") center / cover no-repeat;
      transform: scale(1.02);
    }

    .home-scroll {
      position: relative;
      z-index: 1;
    }

    .shot {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 2.5rem);
      text-align: center;
    }

    .shot-brand {
      font-size: clamp(0.72rem, 2vw, 0.82rem);
      letter-spacing: 0.46em;
      text-transform: uppercase;
      color: rgba(242, 244, 244, 0.92);
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
    }

    .shot-hint {
      margin-top: 1.25rem;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(242, 244, 244, 0.55);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.45);
    }

    .shot a {
      display: block;
      max-width: 18rem;
      color: #f2f4f4;
      text-decoration: none;
      font-size: clamp(1.55rem, 6.5vw, 2.35rem);
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 0.02em;
      text-shadow:
        0 2px 24px rgba(0, 0, 0, 0.65),
        0 1px 0 rgba(0, 0, 0, 0.35);
      transition: letter-spacing 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
    }

    .shot a:hover,
    .shot a:focus-visible {
      letter-spacing: 0.05em;
      opacity: 0.92;
      transform: translateY(-2px);
      outline: none;
    }
  </style>
</head>
<body>
  <div class="photo-bg" aria-hidden="true"></div>

  <main class="home-scroll" aria-label="Mireille">
    <section class="shot" data-reveal>
      <p class="shot-hint">Scroll</p>
    </section>

    <section class="shot" data-reveal>
      <a href="who.html">Who Are You?</a>
    </section>

    <section class="shot" data-reveal>
      <a href="making.html">The Making of Mireille.</a>
    </section>

    <section class="shot" data-reveal>
      <a href="life.html">The Life He Left Behind.</a>
    </section>

    <section class="shot" data-reveal>
      <a href="backstage.html">How Do I Get Backstage?</a>
    </section>

    <section class="shot" data-reveal>
      <a href="terms.html">Terms of Use.</a>
    </section>
  </main>

  <script src="shared.js"></script>
</body>
</html>
