<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mireille</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    html, body {
      background: #090a0c;
      height: 100%;
      overflow: hidden;
    }

    .photo-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(9, 10, 12, 0.22) 0%, rgba(9, 10, 12, 0.42) 70%, rgba(9, 10, 12, 0.58) 100%),
        #090a0c url("mireille.jpg") center / cover no-repeat;
      transform: scale(1.02);
    }

    .home-scroll {
      position: relative;
      z-index: 1;
      height: 100vh;
      height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .shot {
      position: relative;
      min-height: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 2.5rem);
      text-align: center;
    }

    .shot::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(92vw, 26rem);
      height: min(36vh, 13rem);
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center, rgba(9, 10, 12, 0.32) 0%, rgba(9, 10, 12, 0.1) 55%, transparent 72%);
      pointer-events: none;
      z-index: 0;
    }

    .shot-brand,
    .shot-hint,
    .shot a {
      position: relative;
      z-index: 1;
    }

    .shot-brand {
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      font-size: clamp(0.7rem, 1.9vw, 0.78rem);
      font-weight: 500;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: rgba(247, 245, 241, 0.88);
    }

    .shot-hint {
      margin-top: 1.15rem;
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      font-size: 0.68rem;
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(247, 245, 241, 0.42);
    }

    .shot a {
      display: block;
      max-width: min(88vw, 18rem);
      color: #f7f5f1;
      text-decoration: none;
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      font-size: clamp(1.2rem, 4.2vw, 1.55rem);
      font-weight: 500;
      font-style: italic;
      line-height: 1.3;
      letter-spacing: 0.04em;
      text-shadow: none;
      transition: opacity 0.3s ease, letter-spacing 0.35s ease, transform 0.35s ease;
    }

    .shot a:hover,
    .shot a:focus-visible {
      opacity: 0.78;
      letter-spacing: 0.07em;
      transform: translateY(-1px);
      outline: none;
    }
  </style>
</head>
<body>
  <div class="photo-bg" aria-hidden="true"></div>

  <main class="home-scroll" aria-label="Mireille">
    <section class="shot" data-reveal>
      <p class="shot-brand">Mireille</p>
      <p class="shot-hint">Scroll</p>
    </section>

    <section class="shot" data-reveal>
      <a href="who.html">Who Are You?</a>
    </section>

    <section class="shot" data-reveal>
      <a href="making.html">The Making of Mireille.</a>
    </section>

    <section class="shot" data-reveal>
      <a href="life.html">The Life He Left Behind.</a>
    </section>

    <section class="shot" data-reveal>
      <a href="backstage.html">How Do I Get Backstage?</a>
    </section>

    <section class="shot" data-reveal>
      <a href="terms.html">Terms of Use.</a>
    </section>
  </main>

  <script src="shared.js"></script>
</body>
</html>
