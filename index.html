<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mireille — Enter</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #090a0c;
      overflow: hidden;
    }

    .splash {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
    }

    .splash-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #090a0c url("mod.png") center / cover no-repeat;
      filter: contrast(1.05) saturate(0.9);
      transform: scale(1.02);
    }

    .splash-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(9, 10, 12, 0.12), rgba(9, 10, 12, 0.28));
      pointer-events: none;
    }

    .sys {
      width: min(92vw, 22rem);
      background: var(--win-face);
      border-top: 2px solid var(--win-light);
      border-left: 2px solid var(--win-light);
      border-right: 2px solid var(--win-darker);
      border-bottom: 2px solid var(--win-darker);
      box-shadow: 4px 4px 0 rgba(9, 10, 12, 0.45);
      user-select: none;
    }

    .sys-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin: 2px;
      padding: 3px 4px;
      background: var(--win-title);
      color: #fff;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 700;
    }

    .sys-x {
      width: 16px;
      height: 14px;
      display: grid;
      place-items: center;
      background: var(--win-face);
      color: #000;
      border-top: 1px solid var(--win-light);
      border-left: 1px solid var(--win-light);
      border-right: 1px solid var(--win-darker);
      border-bottom: 1px solid var(--win-darker);
      font-size: 9px;
      line-height: 1;
      font-family: var(--sans);
      font-weight: 700;
    }

    .sys-body {
      padding: 1.35rem 1.1rem 1.1rem;
      text-align: center;
      color: #000;
      font-family: var(--sans);
    }

    .sys-msg {
      margin: 0 0 1.15rem;
      font-size: clamp(0.95rem, 3.6vw, 1.05rem);
      font-weight: 700;
      line-height: 1.35;
    }

    .sys-enter {
      appearance: none;
      min-width: 5.5rem;
      padding: 0.35rem 1.1rem 0.4rem;
      font-family: var(--sans);
      font-size: 0.95rem;
      font-weight: 700;
      color: #000;
      background: var(--win-face);
      border-top: 2px solid var(--win-light);
      border-left: 2px solid var(--win-light);
      border-right: 2px solid var(--win-darker);
      border-bottom: 2px solid var(--win-darker);
      cursor: pointer;
    }

    .sys-enter:active {
      border-top: 2px solid var(--win-darker);
      border-left: 2px solid var(--win-darker);
      border-right: 2px solid var(--win-light);
      border-bottom: 2px solid var(--win-light);
      transform: translate(1px, 1px);
    }

    .sys-enter:focus-visible {
      outline: 1px dotted #000;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="splash-bg" aria-hidden="true"></div>
  <main class="splash" aria-label="Enter">
    <section class="sys" role="dialog" aria-labelledby="sys-msg">
      <div class="sys-title">
        <span>System message</span>
        <span class="sys-x" aria-hidden="true">×</span>
      </div>
      <div class="sys-body">
        <p class="sys-msg" id="sys-msg">Fashion as Body Modification</p>
        <button type="button" class="sys-enter" id="enter-btn">Enter</button>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const btn = document.getElementById("enter-btn");
      if (!btn) return;

      const go = async () => {
        try {
          sessionStorage.setItem("mireille-bgm", "1");
        } catch (_) {}

        try {
          const audio = new Audio("track.mp3");
          audio.loop = true;
          audio.preload = "auto";
          window.__mireilleBgm = audio;
          await audio.play();
        } catch (_) {}

        window.setTimeout(() => {
          window.location.href = "home.html";
        }, 120);
      };

      btn.addEventListener("click", go);
    })();
  </script>
</body>
</html>
