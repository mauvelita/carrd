<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mireille</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    html, body {
      background: var(--win-face);
      height: 100%;
      overflow: hidden;
    }

    .notepad {
      position: fixed;
      z-index: 0;
      inset: clamp(0.55rem, 2.2vw, 0.9rem);
      display: flex;
      flex-direction: column;
      background: var(--win-face);
      border-top: 2px solid var(--win-light);
      border-left: 2px solid var(--win-light);
      border-right: 2px solid var(--win-darker);
      border-bottom: 2px solid var(--win-darker);
      box-shadow: 3px 3px 0 rgba(9, 10, 12, 0.28);
      user-select: none;
      pointer-events: none;
    }

    .np-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      margin: 2px;
      padding: 2px 3px 2px 5px;
      background: var(--win-title);
      color: #fff;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      flex-shrink: 0;
    }

    .np-title span { white-space: nowrap; }

    .np-btns {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .np-btn {
      width: 16px;
      height: 14px;
      display: grid;
      place-items: center;
      background: var(--win-face);
      color: #000;
      border-top: 1px solid var(--win-light);
      border-left: 1px solid var(--win-light);
      border-right: 1px solid var(--win-darker);
      border-bottom: 1px solid var(--win-darker);
      font-size: 9px;
      line-height: 1;
      font-family: var(--sans);
      font-weight: 700;
    }

    .np-menu {
      display: flex;
      gap: 0.85rem;
      padding: 2px 8px 3px;
      font-family: var(--sans);
      font-size: 11px;
      color: #000;
      background: var(--win-face);
      flex-shrink: 0;
    }

    .np-menu span::first-letter { text-decoration: underline; }

    .np-body {
      flex: 1;
      display: flex;
      min-height: 0;
      margin: 0 2px 2px;
      border-top: 1px solid var(--win-dark);
      border-left: 1px solid var(--win-dark);
      border-right: 1px solid var(--win-light);
      border-bottom: 1px solid var(--win-light);
      background: #000;
    }

    .np-view {
      flex: 1;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(9, 10, 12, 0.12) 0%, rgba(9, 10, 12, 0.28) 70%, rgba(9, 10, 12, 0.4) 100%),
        #090a0c url("mireille.jpg") center / cover no-repeat;
    }

    .np-scroll {
      width: 16px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--win-face);
      border-left: 1px solid var(--win-dark);
    }

    .np-arrow {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: var(--win-face);
      border-top: 1px solid var(--win-light);
      border-left: 1px solid var(--win-light);
      border-right: 1px solid var(--win-darker);
      border-bottom: 1px solid var(--win-darker);
      font-size: 8px;
      line-height: 1;
      color: #000;
    }

    .np-track {
      flex: 1;
      position: relative;
      background:
        repeating-linear-gradient(
          -45deg,
          #fff 0,
          #fff 1px,
          var(--win-face) 1px,
          var(--win-face) 3px
        );
    }

    .np-thumb {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 22%;
      background: var(--win-face);
      border-top: 1px solid var(--win-light);
      border-left: 1px solid var(--win-light);
      border-right: 1px solid var(--win-darker);
      border-bottom: 1px solid var(--win-darker);
    }

.home-nav {
  position: relative;
  z-index: 1;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: 0.15rem;
  padding: clamp(1.5rem, 5vw, 2.5rem);
  padding-bottom: clamp(5.5rem, 22vh, 9.5rem);
  text-align: center;
}

    .home-nav a {
      position: relative;
      display: block;
      width: max-content;
      max-width: min(88vw, 20rem);
      margin: 0 auto;
      padding: 0.42rem 1.55rem 0.42rem 1.7rem;
      color: #f7f5f1;
      text-decoration: none;
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      font-size: clamp(1.2rem, 4.2vw, 1.55rem);
      font-weight: 500;
      font-style: italic;
      line-height: 1.3;
      letter-spacing: 0.04em;
      text-shadow:
        0 0 14px rgba(247, 245, 241, 0.35),
        0 0 32px rgba(247, 245, 241, 0.16),
        0 0 48px rgba(247, 245, 241, 0.08);
      transition: background 0.15s ease, color 0.15s ease, text-shadow 0.15s ease;
    }

    .home-nav a::before {
      content: "►";
      position: absolute;
      left: 0.35rem;
      top: 50%;
      transform: translateY(-50%);
      font-style: normal;
      font-size: 0.55em;
      letter-spacing: 0;
      opacity: 0;
      color: #fff;
      transition: opacity 0.15s ease;
    }

    .home-nav a:hover,
    .home-nav a:focus-visible {
      background: rgba(0, 0, 128, 0.82);
      color: #fff;
      text-shadow: none;
      outline: none;
    }

    .home-nav a:hover::before,
    .home-nav a:focus-visible::before {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="notepad" aria-hidden="true">
    <div class="np-title">
      <span>--- Notepad</span>
      <div class="np-btns">
        <span class="np-btn">_</span>
        <span class="np-btn">□</span>
        <span class="np-btn">×</span>
      </div>
    </div>
    <div class="np-menu">
      <span>File</span>
      <span>Edit</span>
      <span>Search</span>
      <span>Help</span>
    </div>
    <div class="np-body">
      <div class="np-view"></div>
      <div class="np-scroll">
        <span class="np-arrow">▲</span>
        <div class="np-track">
          <span class="np-thumb"></span>
        </div>
        <span class="np-arrow">▼</span>
      </div>
    </div>
  </div>

  <nav class="home-nav" aria-label="Mireille" data-reveal>
    <a href="who.html">Who Are You?</a>
    <a href="making.html">The Making of Mireille.</a>
    <a href="life.html">The Life He Left Behind.</a>
    <a href="backstage.html">How Do I Get Backstage?</a>
    <a href="terms.html">Terms of Use.</a>
  </nav>

  <script src="shared.js"></script>
</body>
</html>
