<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subject — Mireille d'Épine</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    html, body {
      background: #000;
      min-height: 100%;
      min-height: 100dvh;
    }

    body {
      max-width: none;
      width: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(1rem, 4vw, 2rem);
      padding-bottom: max(1.25rem, env(safe-area-inset-bottom, 0px));
      font-family: var(--sans);
    }

    .page-bg { display: none !important; }

    .unit {
      position: relative;
      z-index: 1;
      width: min(100%, 26rem);
      background: linear-gradient(165deg, #2a2c2e 0%, #141516 48%, #0c0d0e 100%);
      border: 1px solid rgba(232, 236, 236, 0.28);
      box-shadow:
        0 0 0 1px rgba(9, 10, 12, 0.85),
        8px 12px 28px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }

    .unit::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(232, 236, 236, 0.06), transparent 18%),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.08) 2px,
          rgba(0, 0, 0, 0.08) 3px
        );
      opacity: 0.55;
      z-index: 2;
    }

    .chrome {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.55rem 0.65rem;
      border-bottom: 1px solid rgba(232, 236, 236, 0.18);
      background: linear-gradient(90deg, rgba(190, 202, 203, 0.12), rgba(9, 10, 12, 0.35));
    }

    .chrome-id { min-width: 0; }

    .chrome-kicker {
      margin: 0;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(232, 236, 236, 0.55);
    }

    .chrome-name {
      margin: 0.15rem 0 0;
      font-family: var(--serif);
      font-size: clamp(1.05rem, 3.8vw, 1.25rem);
      font-weight: 500;
      font-style: italic;
      letter-spacing: 0.02em;
      color: #f2f4f4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chrome-close {
      flex-shrink: 0;
      width: 1.55rem;
      height: 1.55rem;
      display: grid;
      place-items: center;
      padding: 0;
      appearance: none;
      background: rgba(232, 236, 236, 0.08);
      color: #f2f4f4;
      border: 1px solid rgba(232, 236, 236, 0.28);
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .chrome-close:hover,
    .chrome-close:focus-visible {
      background: rgba(232, 236, 236, 0.18);
      border-color: rgba(232, 236, 236, 0.5);
      outline: none;
    }

    .rail {
      position: relative;
      z-index: 3;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      padding: 0.4rem 0.65rem;
      border-bottom: 1px solid rgba(232, 236, 236, 0.12);
      background: rgba(9, 10, 12, 0.35);
    }

    .rail button {
      appearance: none;
      padding: 0.28rem 0.55rem;
      border: 1px solid transparent;
      background: transparent;
      color: rgba(232, 236, 236, 0.62);
      font-family: var(--sans);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .rail button:hover,
    .rail button:focus-visible {
      color: #f2f4f4;
      border-color: rgba(232, 236, 236, 0.28);
      background: rgba(232, 236, 236, 0.06);
      outline: none;
    }

    .rail button.is-on {
      color: #090a0c;
      background: rgba(232, 236, 236, 0.88);
      border-color: rgba(232, 236, 236, 0.88);
    }

    .viewport {
      position: relative;
      z-index: 1;
      margin: 0;
      background: #000;
      line-height: 0;
      overflow: hidden;
    }

    .viewport img {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 1206 / 872;
      object-fit: cover;
      object-position: center;
      transform: scale(1.04);
      transform-origin: center center;
    }

    .viewport-marks {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      font-family: var(--sans);
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(242, 244, 244, 0.72);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
    }

    .viewport-marks span { position: absolute; }
    .viewport-marks .tl { top: 0.55rem; left: 0.55rem; }
    .viewport-marks .tr { top: 0.55rem; right: 0.55rem; }
    .viewport-marks .bl { bottom: 0.55rem; left: 0.55rem; }

    .corner {
      position: absolute;
      width: 0.85rem;
      height: 0.85rem;
      border: 1px solid rgba(232, 236, 236, 0.55);
      pointer-events: none;
      z-index: 2;
    }

    .corner.nw { top: 0.4rem; left: 0.4rem; border-right: 0; border-bottom: 0; }
    .corner.ne { top: 0.4rem; right: 0.4rem; border-left: 0; border-bottom: 0; }
    .corner.sw { bottom: 0.4rem; left: 0.4rem; border-right: 0; border-top: 0; }
    .corner.se { bottom: 0.4rem; right: 0.4rem; border-left: 0; border-top: 0; }

    .actions {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 0.45rem;
      padding: 0.65rem;
      border-top: 1px solid rgba(232, 236, 236, 0.14);
      background: rgba(9, 10, 12, 0.55);
    }

    .act {
      appearance: none;
      min-height: 2.35rem;
      padding: 0.45rem 0.55rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 0.12rem;
      text-align: left;
      cursor: pointer;
      border: 1px solid rgba(232, 236, 236, 0.22);
      background: rgba(232, 236, 236, 0.06);
      color: #f2f4f4;
      font-family: var(--sans);
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, opacity 0.2s ease;
    }

    .act strong {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .act em {
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: rgba(242, 244, 244, 0.62);
    }

    .act:hover:not(:disabled),
    .act:focus-visible:not(:disabled) {
      background: rgba(232, 236, 236, 0.14);
      border-color: rgba(232, 236, 236, 0.45);
      outline: none;
    }

    .act.is-checked {
      background: rgba(232, 236, 236, 0.9);
      border-color: rgba(232, 236, 236, 0.9);
      color: #090a0c;
    }

    .act.is-checked em { color: rgba(9, 10, 12, 0.62); }

    .act-enter:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .act-enter:not(:disabled) {
      background: #000080;
      border-color: #000080;
      color: #fff;
    }

    .act-enter:not(:disabled) em { color: rgba(255, 255, 255, 0.7); }

    .act-enter:not(:disabled):hover,
    .act-enter:not(:disabled):focus-visible {
      background: #1010a0;
      border-color: #2a2acc;
    }

    .status {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: 1.2fr 0.9fr 0.9fr;
      gap: 1px;
      padding: 0;
      background: rgba(232, 236, 236, 0.12);
      border-top: 1px solid rgba(232, 236, 236, 0.12);
    }

    .status span {
      padding: 0.35rem 0.5rem;
      background: rgba(9, 10, 12, 0.72);
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(232, 236, 236, 0.58);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .foot {
      position: relative;
      z-index: 1;
      margin-top: 1.1rem;
    }

    .foot .footer-nav a {
      text-shadow: none;
      color: rgba(242, 244, 244, 0.85);
    }

    body.png-export .foot { display: none; }
  </style>
</head>
<body>
  <section class="unit" role="application" aria-label="Subject biometric lock">
    <header class="chrome">
      <div class="chrome-id">
        <p class="chrome-kicker">Biometric Lock · File / SUB-01</p>
        <p class="chrome-name">Mireille d'Épine</p>
      </div>
      <button type="button" class="chrome-close" id="btn-close" aria-label="Close">×</button>
    </header>

    <nav class="rail" aria-label="System modules">
      <button type="button" class="is-on" data-rail>Scan</button>
      <button type="button" data-rail>Identity</button>
      <button type="button" data-rail>Optics</button>
      <button type="button" data-rail>Archive</button>
    </nav>

    <figure class="viewport">
      <span class="corner nw" aria-hidden="true"></span>
      <span class="corner ne" aria-hidden="true"></span>
      <span class="corner sw" aria-hidden="true"></span>
      <span class="corner se" aria-hidden="true"></span>
      <img src="edit.jpg" alt="Mireille d'Épine" width="1206" height="872" decoding="async" />
      <div class="viewport-marks" aria-hidden="true">
        <span class="tl">Live feed</span>
        <span class="tr">Fashion / Body</span>
        <span class="bl">Subject locked</span>
      </div>
    </figure>

    <div class="actions">
      <button type="button" class="act" id="btn-verify" aria-pressed="false">
        <strong>Verify</strong>
        <em>I’m not a robot</em>
      </button>
      <button type="button" class="act act-enter" id="btn-enter" disabled>
        <strong>Enter</strong>
        <em>Open archive</em>
      </button>
    </div>

    <div class="status" aria-hidden="true">
      <span id="status-line">Awaiting verification</span>
      <span>Optics · Online</span>
      <span>1206 × 872</span>
    </div>
  </section>

  <div class="foot">
    <nav class="footer-nav" aria-label="Page navigation">
      <a href="home.html" data-nav-home>Back</a>
    </nav>
  </div>

  <script src="shared.js"></script>
  <script>
    (() => {
      if (new URLSearchParams(location.search).has("png")) {
        document.body.classList.add("png-export");
      }

      const verify = document.getElementById("btn-verify");
      const enter = document.getElementById("btn-enter");
      const close = document.getElementById("btn-close");
      const status = document.getElementById("status-line");
      if (!verify || !enter || !close) return;

      verify.addEventListener("click", () => {
        const on = verify.classList.toggle("is-checked");
        verify.setAttribute("aria-pressed", on ? "true" : "false");
        enter.disabled = !on;
        if (status) status.textContent = on ? "Identity confirmed" : "Awaiting verification";
      });

      enter.addEventListener("click", () => {
        if (enter.disabled) return;
        window.location.assign("home.html");
      });

      close.addEventListener("click", () => {
        window.location.assign("home.html");
      });

      document.querySelectorAll("[data-rail]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("[data-rail]").forEach((b) => b.classList.remove("is-on"));
          btn.classList.add("is-on");
        });
      });
    })();
  </script>
</body>
</html>
