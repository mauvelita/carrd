<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mireille</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" />
  <style>
    html, body {
      background: #090a0c;
    }

    .photo-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(180deg, rgba(9, 10, 12, 0.28) 0%, rgba(9, 10, 12, 0.18) 40%, rgba(9, 10, 12, 0.45) 100%),
        #090a0c url("mireille.jpg") center / cover no-repeat;
      transform: scale(1.02);
    }

    .home-scroll {
      position: relative;
      z-index: 1;
    }

    .shot {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 2.5rem);
      text-align: center;
    }

    .shot-brand {
      font-family: "Libre Bodoni", "Cormorant Garamond", "Times New Roman", serif;
      font-size: clamp(0.78rem, 2.1vw, 0.9rem);
      font-weight: 500;
      letter-spacing: 0.52em;
      text-transform: uppercase;
      color: rgba(242, 244, 244, 0.94);
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
    }

    .shot-hint {
      margin-top: 1.35rem;
      font-family: "Libre Bodoni", "Cormorant Garamond", serif;
      font-size: 0.68rem;
      font-style: italic;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: rgba(242, 244, 244, 0.5);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.45);
    }

    .shot a {
      display: block;
      max-width: min(92vw, 22rem);
      color: #f7f5f1;
      text-decoration: none;
      font-family: "Libre Bodoni", "Cormorant Garamond", "Times New Roman", serif;
      font-size: clamp(2rem, 8.2vw, 3.35rem);
      font-weight: 500;
      font-style: italic;
      line-height: 1.05;
      letter-spacing: -0.01em;
      text-shadow:
        0 2px 28px rgba(0, 0, 0, 0.7),
        0 1px 2px rgba(0, 0, 0, 0.45);
      transition: letter-spacing 0.35s ease, opacity 0.3s ease, transform 0.35s ease, text-shadow 0.35s ease;
    }

    .shot a:hover,
    .shot a:focus-visible {
      letter-spacing: 0.02em;
      opacity: 0.95;
      transform: translateY(-3px);
      text-shadow:
        0 4px 34px rgba(0, 0, 0, 0.75),
        0 1px 2px rgba(0, 0, 0, 0.5);
      outline: none;
    }
  </style>
</head>
<body>
  <div class="photo-bg" aria-hidden="true"></div>

  <main class="home-scroll" aria-label="Mireille">
    <section class="shot" data-reveal>
      <p class="shot-hint">Scroll</p>
    </section>

    <section class="shot" data-reveal>
      <a href="who.html">Who Are You?</a>
    </section>

    <section class="shot" data-reveal>
      <a href="making.html">The Making of Mireille.</a>
    </section>

    <section class="shot" data-reveal>
      <a href="life.html">The Life He Left Behind.</a>
    </section>

    <section class="shot" data-reveal>
      <a href="backstage.html">How Do I Get Backstage?</a>
    </section>

    <section class="shot" data-reveal>
      <a href="terms.html">Terms of Use.</a>
    </section>
  </main>

  <script src="shared.js"></script>
</body>
</html>
