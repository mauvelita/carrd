<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIREILLE.BMP</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    html, body {
      background: #000;
      min-height: 100%;
      min-height: 100dvh;
    }

    body {
      max-width: none;
      width: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(1rem, 4vw, 2rem);
      padding-bottom: max(1.25rem, env(safe-area-inset-bottom, 0px));
    }

    .page-bg { display: none !important; }

    .win {
      position: relative;
      z-index: 1;
      width: min(100%, 26rem);
      display: flex;
      flex-direction: column;
      background: var(--win-face);
      border-top: 2px solid var(--win-light);
      border-left: 2px solid var(--win-light);
      border-right: 2px solid var(--win-darker);
      border-bottom: 2px solid var(--win-darker);
      box-shadow:
        4px 4px 0 rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(0, 0, 0, 0.35);
      user-select: none;
    }

    .win-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      margin: 2px;
      padding: 3px 3px 3px 6px;
      background: linear-gradient(90deg, #000080 0%, #1084d0 100%);
      color: #fff;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
    }

    .win-title-left {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      min-width: 0;
    }

    .win-icon {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      background:
        linear-gradient(135deg, #fff 0 35%, transparent 35%),
        linear-gradient(225deg, #c0c0c0 0 40%, #808080 40%);
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: inset 0 0 0 1px #000080;
    }

    .win-title-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .win-btns {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .win-btn {
      width: 16px;
      height: 14px;
      display: grid;
      place-items: center;
      padding: 0;
      background: var(--win-face);
      color: #000;
      border-top: 1px solid var(--win-light);
      border-left: 1px solid var(--win-light);
      border-right: 1px solid var(--win-darker);
      border-bottom: 1px solid var(--win-darker);
      font-size: 9px;
      line-height: 1;
      font-family: var(--sans);
      font-weight: 700;
      cursor: pointer;
    }

    .win-btn:active {
      border-top: 1px solid var(--win-darker);
      border-left: 1px solid var(--win-darker);
      border-right: 1px solid var(--win-light);
      border-bottom: 1px solid var(--win-light);
      transform: translate(1px, 1px);
    }

    .win-menu {
      display: flex;
      flex-wrap: wrap;
      gap: 0.15rem 0.85rem;
      padding: 2px 8px 3px;
      font-family: var(--sans);
      font-size: 11px;
      color: #000;
      background: var(--win-face);
    }

    .win-menu button {
      appearance: none;
      border: 0;
      background: transparent;
      font: inherit;
      color: inherit;
      padding: 1px 3px;
      cursor: pointer;
    }

    .win-menu button:hover,
    .win-menu button:focus-visible {
      background: var(--win-title);
      color: #fff;
      outline: none;
    }

    .win-menu button::first-letter { text-decoration: underline; }

    .win-toolbar {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 3px 5px 4px;
      border-top: 1px solid var(--win-light);
      border-bottom: 1px solid var(--win-dark);
      background: var(--win-face);
    }

    .tb {
      width: 22px;
      height: 20px;
      display: grid;
      place-items: center;
      background: var(--win-face);
      border-top: 1px solid var(--win-light);
      border-left: 1px solid var(--win-light);
      border-right: 1px solid var(--win-darker);
      border-bottom: 1px solid var(--win-darker);
      font-family: var(--sans);
      font-size: 8px;
      font-weight: 700;
      color: #000;
      cursor: pointer;
    }

    .tb:active {
      border-top-color: var(--win-darker);
      border-left-color: var(--win-darker);
      border-right-color: var(--win-light);
      border-bottom-color: var(--win-light);
    }

    .tb-sep {
      width: 1px;
      height: 16px;
      margin: 0 3px;
      background: var(--win-dark);
      box-shadow: 1px 0 0 var(--win-light);
    }

    .tb-path {
      flex: 1;
      min-width: 0;
      margin-left: 4px;
      padding: 2px 5px;
      font-family: var(--sans);
      font-size: 10px;
      color: #000;
      background: #fff;
      border-top: 1px solid var(--win-dark);
      border-left: 1px solid var(--win-dark);
      border-right: 1px solid var(--win-light);
      border-bottom: 1px solid var(--win-light);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .win-body {
      margin: 0 2px;
      border: 1px solid #000;
      background: #000;
      line-height: 0;
      overflow: hidden;
    }

    .win-body img {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 1206 / 872;
      object-fit: cover;
      object-position: center;
      transform: scale(1.04);
      transform-origin: center center;
    }

    .win-status {
      display: grid;
      grid-template-columns: 1.4fr 0.9fr 0.85fr;
      gap: 2px;
      margin: 2px;
      padding: 0;
      font-family: var(--sans);
      font-size: 10px;
      color: #000;
      background: var(--win-face);
    }

    .win-status span {
      padding: 2px 5px;
      border-top: 1px solid var(--win-dark);
      border-left: 1px solid var(--win-dark);
      border-right: 1px solid var(--win-light);
      border-bottom: 1px solid var(--win-light);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .foot {
      position: relative;
      z-index: 1;
      margin-top: 1.1rem;
    }

    .foot .footer-nav a {
      text-shadow: none;
      color: rgba(242, 244, 244, 0.85);
    }

    body.png-export .foot { display: none; }
  </style>
</head>
<body>
  <section class="win" role="application" aria-label="Image viewer">
    <div class="win-title">
      <div class="win-title-left">
        <span class="win-icon" aria-hidden="true"></span>
        <span class="win-title-label">MIREILLE.BMP — Archive Viewer</span>
      </div>
      <div class="win-btns">
        <button type="button" class="win-btn" aria-label="Minimize">_</button>
        <button type="button" class="win-btn" aria-label="Maximize">□</button>
        <button type="button" class="win-btn" aria-label="Close">×</button>
      </div>
    </div>

    <nav class="win-menu" aria-label="Viewer menu">
      <button type="button">File</button>
      <button type="button">Edit</button>
      <button type="button">View</button>
      <button type="button">Image</button>
      <button type="button">Help</button>
    </nav>

    <div class="win-toolbar" aria-hidden="true">
      <button type="button" class="tb" title="Open">Op</button>
      <button type="button" class="tb" title="Save">Sv</button>
      <span class="tb-sep"></span>
      <button type="button" class="tb" title="Zoom in">+</button>
      <button type="button" class="tb" title="Fit">[]</button>
      <span class="tb-sep"></span>
      <div class="tb-path">C:\ARCHIVE\MIREILLE\edit.jpg</div>
    </div>

    <div class="win-body">
      <img src="edit.jpg" alt="Mireille d'Épine" width="1206" height="872" decoding="async" />
    </div>

    <div class="win-status">
      <span>Ready · not a robot</span>
      <span>1206 × 872</span>
      <span>24-bit BMP</span>
    </div>
  </section>

  <div class="foot">
    <nav class="footer-nav" aria-label="Page navigation">
      <a href="home.html" data-nav-home>Back</a>
    </nav>
  </div>

  <script src="shared.js"></script>
  <script>
    if (new URLSearchParams(location.search).has("png")) {
      document.body.classList.add("png-export");
    }
  </script>
</body>
</html>
